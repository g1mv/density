[package]
name = "density-7zip-bridge"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
density = { package = "density-rs", path = "../.." }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
